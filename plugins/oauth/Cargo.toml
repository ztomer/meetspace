[package]
name = "tauri-plugin-oauth"
version = "0.1.0"
authors = ["Meetspace"]
edition = "2021"
exclude = ["/js", "/node_modules"]
links = "tauri-plugin-oauth"
description = "OAuth 2.0 PKCE flow with localhost redirect"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dev-dependencies]
specta-typescript = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[dependencies]
tauri = { workspace = true, features = ["test"] }
tauri-plugin-opener2 = { workspace = true }
tauri-specta = { workspace = true, features = ["derive", "typescript"] }

serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
thiserror = { workspace = true }

# OAuth flow primitives
axum = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "time", "sync"] }
reqwest = { workspace = true, features = ["json", "default-tls", "form"] }
sha2 = { workspace = true }
base64 = { workspace = true }
url = { workspace = true }
tracing = { workspace = true }
getrandom = "0.2"

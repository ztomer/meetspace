[package]
name = "vad"
version = "0.1.0"
edition = "2024"

[features]
earshot = ["dep:earshot"]
silero-onnx = ["dep:meetspace-onnx"]

[dependencies]
earshot = { workspace = true, optional = true }
meetspace-onnx = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
approx = { workspace = true }
criterion = { workspace = true }
meetspace-data = { workspace = true }
meetspace-onnx = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[[bench]]
name = "vad"
harness = false
required-features = ["earshot", "silero-onnx"]

[[test]]
name = "compare"
required-features = ["earshot", "silero-onnx"]

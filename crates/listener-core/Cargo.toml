[package]
name = "listener-core"
version = "0.1.0"
edition = "2024"

[features]
default = []
specta = ["dep:specta"]
tauri-event = ["specta", "dep:tauri-specta"]

[dependencies]
meetspace-audio = { workspace = true }
meetspace-audio-utils = { workspace = true }
meetspace-device-monitor = { workspace = true }
meetspace-host = { workspace = true }
meetspace-language = { workspace = true }
meetspace-storage = { workspace = true }
meetspace-supervisor = { workspace = true }
meetspace-transcribe-soniqo = { workspace = true }
meetspace-transcript = { workspace = true }
meetspace-vad-masking = { workspace = true }

owhisper-client = { workspace = true }
owhisper-interface = { workspace = true }

hound = { workspace = true }
meetspace-mp3 = { workspace = true }
vorbis_rs = { workspace = true }

ractor = { workspace = true, features = ["async-trait"] }

bytes = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true, optional = true }
tauri-specta = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

sentry = { workspace = true }

[dev-dependencies]
meetspace-data = { workspace = true }
tempfile = { workspace = true }
tracing-subscriber = { workspace = true }

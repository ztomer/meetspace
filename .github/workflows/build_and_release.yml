name: Build & Release Artifacts

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the built artifacts to (e.g. v1.0.32). Leave blank to only build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (DMG)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache cargo registry and builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Determine version
        uses: ./.github/actions/determine-version
        with:
          release_tag: ${{ inputs.release_tag }}

      - name: Inject version into package.json and tauri configs
        run: |
          CLEAN_VERSION="${VERSION#v}"
          # Cargo/Tauri require strict semver, so we convert any underscores to hyphens
          CARGO_VERSION="${CLEAN_VERSION//_/-}"
          node -e "
            const fs = require('fs');

            // 1. Inject into package.json
            const pkg = JSON.parse(fs.readFileSync('apps/desktop/package.json', 'utf8'));
            pkg.version = '$CARGO_VERSION';
            fs.writeFileSync('apps/desktop/package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');

            // 2. Inject into tauri.conf.json
            const tauriConf = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.json', 'utf8'));
            tauriConf.version = '$CARGO_VERSION';
            fs.writeFileSync('apps/desktop/src-tauri/tauri.conf.json', JSON.stringify(tauriConf, null, 2) + '\n', 'utf8');

            // 3. Inject into tauri.conf.stable.json
            const stableConf = JSON.parse(fs.readFileSync('apps/desktop/src-tauri/tauri.conf.stable.json', 'utf8'));
            stableConf.version = '$CARGO_VERSION';
            fs.writeFileSync('apps/desktop/src-tauri/tauri.conf.stable.json', JSON.stringify(stableConf, null, 2) + '\n', 'utf8');
          "

      - name: Build macOS DMG
        run: |
          chmod +x scripts/package.sh
          ./scripts/package.sh stable dmg

      - name: Locate built DMG
        run: |
          DMG_PATH=$(find target/release/bundle apps/desktop/src-tauri/target/release/bundle -maxdepth 3 -type f -name '*.dmg' | head -n 1)
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          echo "Found DMG at: $DMG_PATH"

      - name: Upload DMG (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Meetspace-macOS-aarch64-${{ env.VERSION }}
          path: ${{ env.DMG_PATH }}
          retention-days: 30

      - name: Upload DMG to Release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        run: |
          TAG="${{ github.event.release.tag_name || inputs.release_tag }}"
          echo "Attaching $DMG_PATH to release $TAG"
          gh release upload "$TAG" "$DMG_PATH" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
